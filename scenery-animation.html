<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scenery Animation</title>
<style>
  :root{
    --tinta:#f4f6ff; --tenue:#98a0c0; --acento:#7c5cff; --acento2:#22d3ee;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#05060c;color:var(--tinta);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}

  #cielo{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* Todo el "scroll" es una sola capa que se desplaza. No hay scroll nativo:
     la pagina es una funcion del tiempo. */
  #mundo{position:fixed;inset:0}

  .seccion{position:absolute;inset:0;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;
    padding:0 9%;will-change:transform,opacity}

  h1{font-size:16vw;line-height:.92;font-weight:800;letter-spacing:-.04em}
  h1 em{font-style:normal;background:linear-gradient(100deg,var(--acento),var(--acento2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:1.6vh;font-size:1.5vh;letter-spacing:.34em;text-transform:uppercase;
    color:var(--tenue)}
  .baja{margin-top:4vh;display:flex;align-items:center;gap:.9vh;font-size:1.3vh;
    color:var(--tenue);letter-spacing:.2em;text-transform:uppercase}
  .baja i{width:1px;height:5vh;background:linear-gradient(var(--acento2),transparent);
    display:block;animation:latido 1.8s ease-in-out infinite}
  @keyframes latido{0%,100%{opacity:.35}50%{opacity:1}}

  .rejilla{display:grid;gap:1.8vh;width:100%}
  .tarjeta{display:flex;gap:1.6vh;align-items:center;text-align:left;
    padding:2.2vh 4vw;border-radius:2.2vh;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .tarjeta span{flex:0 0 auto;width:5.4vh;height:5.4vh;border-radius:1.6vh;
    display:grid;place-items:center;font-size:2.2vh;
    background:linear-gradient(140deg,rgba(124,92,255,.35),rgba(34,211,238,.22));
    border:1px solid rgba(255,255,255,.16)}
  .tarjeta b{display:block;font-size:1.85vh;font-weight:650;margin-bottom:.5vh}
  .tarjeta p{font-size:1.45vh;color:var(--tenue);line-height:1.35}

  .cta{margin-top:4.5vh;padding:2vh 8vw;border-radius:99px;font-size:1.9vh;font-weight:650;
    color:#0a0b14;background:linear-gradient(100deg,var(--acento2),#9df);border:0;
    box-shadow:0 2vh 6vh rgba(34,211,238,.28)}
</style>
</head>
<body>
<canvas id="cielo"></canvas>
<div id="mundo">

  <section class="seccion" id="s0">
    <h1>SCENERY<br><em>ANIMATION</em></h1>
    <p class="sub">un solo archivo · sin librerias</p>
    <div class="baja"><i></i>scroll</div>
  </section>

  <section class="seccion" id="s1">
    <div class="rejilla">
      <div class="tarjeta"><span>&#9670;</span><div><b>Capas con parallax</b>
        <p>cada montana se mueve a su propia velocidad</p></div></div>
      <div class="tarjeta"><span>&#9673;</span><div><b>Cielo por hora</b>
        <p>la paleta entera viaja de la noche al dia</p></div></div>
      <div class="tarjeta"><span>&#9678;</span><div><b>Ruido con semilla</b>
        <p>el mismo paisaje sale igual siempre</p></div></div>
    </div>
  </section>

  <section class="seccion" id="s2">
    <h1 style="font-size:11vw">100% CODIGO<br><em>0% DEPENDENCIAS</em></h1>
    <button class="cta">Ver el codigo</button>
  </section>

</div>

<script>
// ------------------------------------------------------------------ lienzo ----
const cv = document.getElementById('cielo');
const ctx = cv.getContext('2d');
let W = 0, H = 0;

function medir() {
  const d = window.devicePixelRatio || 1;
  W = cv.width = Math.round(innerWidth * d);
  H = cv.height = Math.round(innerHeight * d);
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
}
medir();
addEventListener('resize', medir);

// ------------------------------------------------------- ruido con semilla ----
// Value noise 1D. Todo el paisaje sale de esta funcion, asi que el mismo
// numero de semilla dibuja siempre el mismo horizonte.
function azar(semilla) {
  let s = semilla >>> 0;
  return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
}

function ruido(semilla, n) {
  const r = azar(semilla), tabla = [];
  for (let i = 0; i < n; i++) tabla.push(r());
  return (x) => {
    const i = Math.floor(x), f = x - i;
    const a = tabla[((i % n) + n) % n], b = tabla[(((i + 1) % n) + n) % n];
    return a + (b - a) * (f * f * (3 - 2 * f));
  };
}

// ------------------------------------------------------------- el paisaje ----
const CAPAS = [
  { semilla: 11, freq: 0.9, alto: 0.30, par: 0.030, tono: [12, 16, 38] },
  { semilla: 27, freq: 1.7, alto: 0.24, par: 0.080, tono: [18, 24, 54] },
  { semilla: 43, freq: 3.1, alto: 0.18, par: 0.170, tono: [26, 34, 72] },
  { semilla: 61, freq: 5.4, alto: 0.13, par: 0.330, tono: [36, 46, 94] },
];

const r = azar(7);
const ESTRELLAS = Array.from({ length: 150 }, () => ({
  x: r(), y: r() * 0.72, t: 0.5 + r() * 2.5, f: 0.6 + r() * 1.6,
}));
const AVES = Array.from({ length: 5 }, (_, i) => ({
  y: 0.18 + i * 0.045, vel: 0.035 + r() * 0.05, fase: r() * 6.28, tam: 5 + r() * 4,
}));

// Paletas del cielo, de la noche al dia. El progreso del scroll interpola
// entre ellas, que es lo que hace que subir se sienta como amanecer.
const PALETAS = [
  { arriba: [6, 7, 18], abajo: [26, 16, 46], sol: [120, 96, 200], dia: 0.0 },
  { arriba: [22, 14, 42], abajo: [92, 40, 74], sol: [255, 150, 120], dia: 0.35 },
  { arriba: [40, 62, 120], abajo: [214, 138, 120], sol: [255, 226, 170], dia: 0.75 },
  { arriba: [30, 44, 96], abajo: [180, 96, 110], sol: [255, 176, 120], dia: 0.45 },
];

const mezcla = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = (c) => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

function cielo(p) {
  const k = Math.min(PALETAS.length - 1.001, Math.max(0, p * (PALETAS.length - 1)));
  const i = Math.floor(k), f = k - i;
  const A = PALETAS[i], B = PALETAS[i + 1];
  return {
    arriba: mezcla(A.arriba, B.arriba, f),
    abajo: mezcla(A.abajo, B.abajo, f),
    sol: mezcla(A.sol, B.sol, f),
    dia: A.dia + (B.dia - A.dia) * f,
  };
}

// ------------------------------------------------------------- el dibujo ----
function dibujar(p, sy) {
  ctx.save();
  ctx.scale(cv.width / innerWidth, cv.height / innerHeight);

  const w = innerWidth, h = innerHeight;
  const C = cielo(p);

  // cielo
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, rgb(C.arriba));
  g.addColorStop(1, rgb(C.abajo));
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  // estrellas: se apagan conforme llega el dia
  if (C.dia < 1) {
    for (const e of ESTRELLAS) {
      const b = 0.35 + 0.65 * Math.abs(Math.sin(p * e.f * 6.28 + e.t));
      ctx.globalAlpha = b * (1 - C.dia) * 0.9;
      ctx.fillStyle = '#fff';
      ctx.fillRect(e.x * w, e.y * h - sy * 6, 1.4, 1.4);
    }
    ctx.globalAlpha = 1;
  }

  // sol: baja por el cielo a medida que se "scrollea"
  const sx = w * 0.5, syy = h * (0.44 - p * 0.16);
  const halo = ctx.createRadialGradient(sx, syy, 0, sx, syy, w * 0.75);
  halo.addColorStop(0, `rgba(${C.sol[0]|0},${C.sol[1]|0},${C.sol[2]|0},.55)`);
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.fillRect(0, 0, w, h);
  ctx.beginPath(); ctx.arc(sx, syy, w * 0.135, 0, 6.2832);
  ctx.fillStyle = rgb(C.sol); ctx.fill();

  // aves
  ctx.strokeStyle = 'rgba(10,10,20,.55)'; ctx.lineWidth = 1.3;
  for (const a of AVES) {
    const x = ((p * a.vel + a.fase) % 1.2 - 0.1) * w;
    const y = a.y * h + Math.sin(p * 6.28 + a.fase) * h * 0.02;
    ctx.beginPath();
    ctx.moveTo(x - a.tam, y);
    ctx.quadraticCurveTo(x - a.tam / 2, y - a.tam * 0.55, x, y);
    ctx.quadraticCurveTo(x + a.tam / 2, y - a.tam * 0.55, x + a.tam, y);
    ctx.stroke();
  }

  // montanas: de la mas lejana a la mas cercana
  CAPAS.forEach((capa, i) => {
    const n = ruido(capa.semilla, 64);
    const base = h * (1 - capa.alto * (0.55 + 0.45 * (1 - i / CAPAS.length)));
    const desfase = sy * capa.par * h * 2.2;
    ctx.beginPath();
    ctx.moveTo(0, h);
    for (let x = 0; x <= w; x += 3) {
      const u = (x / w) * capa.freq * 6 + desfase * 0.01 + i * 13;
      const y = base - n(u) * h * capa.alto - n(u * 2.7 + 5) * h * capa.alto * 0.35;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, h); ctx.closePath();
    const t = C.dia * 0.55;
    ctx.fillStyle = rgb(capa.tono.map((v) => v + t * 34));
    ctx.fill();
  });

  // niebla baja: cose las capas y esconde la union con el suelo
  const niebla = ctx.createLinearGradient(0, h * 0.72, 0, h);
  niebla.addColorStop(0, 'rgba(8,10,22,0)');
  niebla.addColorStop(1, 'rgba(8,10,22,.96)');
  ctx.fillStyle = niebla; ctx.fillRect(0, h * 0.72, w, h * 0.28);

  ctx.restore();
}

// ----------------------------------------------------------- el recorrido ----
// sy: 0 -> 3. Cada unidad es "una pantalla". Las tres secciones viven en 0, 1 y 2.
function suavizar(x) { return x * x * (3 - 2 * x); }

function recorrido(t) {
  // En modo captura la pagina recibe la duracion real del video y el recorrido se hace
  // UNA vez de principio a fin: sin esto el ciclo se repite y el corte entre el final y
  // el principio se ve. Abierta a mano, sin duracion, se repite cada 26 s.
  const total = (window.__DURACION_MS || 26000) / 1000;
  const P = Math.min(0.9999, (t % total) / total);
  // Cada pareja es (a donde llega, cuando). Entre dos parejas, el recorrido se suaviza.
  const tramos = [0, 0.00, 1, 0.34, 1.6, 0.52, 2, 0.70, 2.6, 0.84, 3, 1.00];
  for (let i = 0; i < tramos.length - 2; i += 2) {
    const v0 = tramos[i], t0 = tramos[i + 1];
    const v1 = tramos[i + 2], t1 = tramos[i + 3];
    if (P >= t0 && P <= t1) {
      const k = suavizar((P - t0) / (t1 - t0));
      return { sy: v0 + (v1 - v0) * k };
    }
  }
  return { sy: 3 };
}

function seccion(el, distancia, opacidad) {
  el.style.transform = `translate3d(0,${-distancia * 26}vh,0) scale(${1 - distancia * 0.16})`;
  el.style.opacity = opacidad;
}

function pintar(t) {
  const { sy } = recorrido(t);
  // El cielo es el MISMO numero que el scroll: subir por la pagina es amanecer y
  // anochecer. No hay una segunda linea de tiempo que mantener en sincronia.
  dibujar(sy / 3, sy);
  const dentro = (a, b) => Math.max(0, 1 - Math.abs(sy - a) / b);
  seccion(document.getElementById('s0'), sy, dentro(0, 0.5));
  seccion(document.getElementById('s1'), sy - 1, dentro(1, 0.5));
  seccion(document.getElementById('s2'), sy - 2, dentro(2, 0.5));
}

// -------------------------------------------------- modo captura (opcional) --
// El grabador pone window.__MODO_CAPTURA = true ANTES de cargar la pagina. En ese
// modo la animacion no corre sola: solo obedece a __seek(ms). Es lo que permite
// capturar a 30 fps exactos y que el video salga igual todas las veces.
let T = 0;
window.__seek = function (ms) { T = ms / 1000; pintar(T); };

if (!window.__MODO_CAPTURA) {
  const t0 = performance.now();
  (function bucle(ahora) { pintar((ahora - t0) / 1000); requestAnimationFrame(bucle); })(t0);
} else {
  pintar(0);
}
</script>
</body>
</html>
